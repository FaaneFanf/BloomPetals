    <h1>Par ici les infos persos</h1>

    <form action="#" method="post"> <!--<form> : contient l'ensemble du formulaire.-->

        <!-- Civilité -->
        <label for="civilite">Civilité :</label>
        <select id="civilite" name="civilite" required> 
            <!--<select> : crée la liste déroulante pour la civilité.-->
            <!--required : rend le champ obligatoire avant la soumission.-->
            <option value="">-- Sélectionnez --</option>
            <option value="madame">Madame</option>
            <option value="monsieur">Monsieur</option>
            <option value="autre">Autre</option>
        </select>

        <br><br> <!--<br> saut de ligne-->

        <!-- Nom -->
        <label for="nom">Nom :</label>
        <input type="text" id="nom" name="nom" required> 
        <!--<input type="text"> : permet de saisir le nom et le prénom.-->
        <!--required : rend le champ obligatoire avant la soumission.-->

        <br><br>

        <!-- Prénom -->
        <label for="prenom">Prénom :</label>
        <input type="text" id="prenom" name="prenom" required>


        <br><br>

        <!-- Adresse postale -->
        <label for="adresse">Adresse postale :</label>
        <textarea id="adresse" name="adresse" rows="4" cols="40" required></textarea> 
        <!--<textarea> : permet de saisir une adresse postale sur plusieurs lignes.-->    
        <!--required : rend le champ obligatoire avant la soumission.-->
        <br><br>

        <!-- Politique de confidentialité -->
        <input type="checkbox" id="confidentialite" name="confidentialite" required> <!--<input type="checkbox"> : permet de valider la politique de confidentialité.-->
        <label for="confidentialite">
            J'accepte la politique de confidentialité de l'entreprise (on en a acune)
        </label>

        <br><br>

        <!-- Bouton de validation -->
        <button type="submit">Envoyer</button> <!--<button type="submit"> : bouton d'envoi du formulaire.-->

    </form>
